database_id = "8d486892-1569-4863-a4be-668984c0b8a2"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5e49ec60e71e4b029c8f641f6a857d01"

[triggers]
crons = ["0 * * * *"]
