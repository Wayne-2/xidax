[vars]
PAYMENT_PROVIDER = "bachs"
BACHS_API_BASE = "https://sandbox-api.bachs.io"
BACHS_CRYPTO_PATH = "/v1/charges"
BACHS_WIRE_PATH = "/v1/transfers"
WIRE_BENEFICIARY = "Pcmart Technologies Ltd"
WIRE_BANK_NAME = "Pcmart Payments Bank"
WIRE_ROUTING_CODE = "021000021"
WIRE_SWIFT = "PCMAGTNG"

[[d1_databases]]
